services:
  nats-jetstream:
    image: nats:2.10-alpine
    container_name: fmdp-poc-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--max_mem_store=64MB"
      - "--max_file_store=512MB"
      - "--http_port=8222"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_poc_data:/data
    mem_limit: 256m
    cpus: 1.5
    restart: unless-stopped

volumes:
  nats_poc_data:
    name: fmdp_poc_nats_data

