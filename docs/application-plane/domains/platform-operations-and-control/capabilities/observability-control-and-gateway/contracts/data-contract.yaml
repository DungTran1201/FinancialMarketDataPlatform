schema_version: "2.0.0"
contract_id: "CTR-APP-OPS-001"
title: "Observability Telemetry & Probe Response Contracts"
owner_role: "devops-sre"
document_status: "IN_REVIEW"
implementation_status: "PARTIALLY_IMPLEMENTED"
entities:
  - name: "KafkaClusterBrokerReport"
    location: "probe_external_infrastructure -> services.kafka_cluster_brokers[]"
    required_fields:
      - name: "broker_id"
        type: "integer"
        notes: "1 (ACTIVE/LIVE_CONTAINER), 2 & 3 (explicit UNAVAILABLE in 1-node KRaft compose)"
      - name: "status"
        type: "string"
        notes: "LIVE_CONTAINER | IN_PROCESS_ACTIVE | UNAVAILABLE"
  - name: "ObservabilityCandleBar"
    location: "GET /api/v1/observability/candles -> candles[]"
    required_fields:
      - name: "open"
        type: "number"
        notes: "UI chart float"
      - name: "open_str"
        type: "string"
        notes: "Exact Decimal wire string preserved alongside float"
      - name: "ingestion_lag_ms"
        type: "number"
breaking_change_policy: "Single-node Kafka honesty fields and string precision mirrors MUST NOT be removed."
