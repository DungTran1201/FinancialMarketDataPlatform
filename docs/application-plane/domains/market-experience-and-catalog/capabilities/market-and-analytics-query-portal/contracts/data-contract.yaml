schema_version: "2.0.0"
contract_id: "CTR-APP-MKT-001"
title: "Market Quote, Historical Kline & Quant Response Contract"
owner_role: "fullstack-engineer"
document_status: "IN_REVIEW"
implementation_status: "PARTIALLY_IMPLEMENTED"
entities:
  - name: "MarketPriceEnvelope"
    location: "GET /api/v1/market/prices/{symbol}"
    required_fields:
      - name: "data.provider"
        type: "string"
      - name: "data.symbol"
        type: "string"
      - name: "data.last_price"
        type: "string"
        notes: "Decimal wire string"
      - name: "data.age_ms"
        type: "number"
      - name: "data.is_stale"
        type: "boolean"
      - name: "meta.source"
        type: "string"
        notes: "redis_hot_cache | clickhouse_fallback"
  - name: "HistoricalKlineDto"
    location: "GET /api/v1/historical/klines/{symbol}"
    required_fields:
      - name: "open_price"
        type: "string"
      - name: "high_price"
        type: "string"
      - name: "low_price"
        type: "string"
      - name: "close_price"
        type: "string"
      - name: "base_volume"
        type: "string"
      - name: "quote_volume"
        type: "string"
breaking_change_policy: "Money/volume fields MUST NOT switch from Decimal strings to JSON numbers inside module REST envelopes."
