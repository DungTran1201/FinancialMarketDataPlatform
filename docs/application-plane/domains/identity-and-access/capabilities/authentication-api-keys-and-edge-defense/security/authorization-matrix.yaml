schema_version: "2.0.0"
capability_id: "CAP-APP-IAM-001"
owner_role: "security-architect"
document_status: "DRAFT"
implementation_status: "NOT_IMPLEMENTED"
default_policy: "DENY_BY_DEFAULT"
rules:
  - rule_id: "AUTHZ-IAM-001"
    subject: "unauthenticated"
    resource: "POST /api/v1/auth/token"
    action: "execute"
    condition: "Valid registered user credentials verified against Postgres users table"
    expected_decision: "ALLOW"
    verified_by_test: "TC-IAM-001"
    as_is_enforced: true
  - rule_id: "AUTHZ-IAM-002"
    subject: "unauthenticated"
    resource: "POST /api/v1/auth/revoke"
    action: "revoke"
    condition: "Requires role:admin (iam:admin) OR self token holder"
    expected_decision: "DENY"
    verified_by_test: "TC-IAM-005"
    as_is_enforced: false
  - rule_id: "AUTHZ-IAM-003"
    subject: "role:admin"
    resource: "POST|GET|DELETE /api/v1/auth/api-keys"
    action: "admin"
    condition: "Verified Bearer JWT with iam:admin capability (AS-IS: POST open, GET/DELETE 405)"
    expected_decision: "ALLOW"
    verified_by_test: "TC-IAM-003"
    as_is_enforced: false
  - rule_id: "AUTHZ-IAM-004"
    subject: "role:viewer | role:analyst"
    resource: "POST /api/v1/auth/api-keys"
    action: "admin"
    condition: "Caller lacks iam:admin scope"
    expected_decision: "DENY"
    verified_by_test: "TC-IAM-005"
    as_is_enforced: false
  - rule_id: "AUTHZ-IAM-005"
    subject: "role:operator | role:admin"
    resource: "GET /api/v1/auth/domains"
    action: "read"
    condition: "Verified JWT with catalog:write or iam:admin"
    expected_decision: "ALLOW"
    verified_by_test: "TC-IAM-004"
    as_is_enforced: false
