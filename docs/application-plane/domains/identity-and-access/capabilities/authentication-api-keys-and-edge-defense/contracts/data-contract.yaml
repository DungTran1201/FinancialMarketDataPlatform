schema_version: "2.0.0"
contract_id: "CTR-APP-IAM-001"
title: "IAM Claims, API Key & User Credential Contract"
owner_role: "security-architect"
document_status: "DRAFT"
implementation_status: "PARTIALLY_IMPLEMENTED"
entities:
  - name: "JwtTokenBundle"
    location: "POST /api/v1/auth/token -> data"
    required_fields:
      - name: "access_token"
        type: "string"
        notes: "HS256 compact JWS string"
      - name: "token_type"
        type: "string"
        notes: "Fixed 'bearer'"
      - name: "expires_in"
        type: "integer"
        notes: "Seconds from cfg.jwt_access_token_expire_minutes * 60"
      - name: "jti"
        type: "string"
      - name: "token_sha256_hash"
        type: "string"
      - name: "bound_ip_hash"
        type: "string"
      - name: "issuer"
        type: "string"
  - name: "ApiKeyMintResponse"
    location: "POST /api/v1/auth/api-keys -> data"
    required_fields:
      - name: "api_key_once"
        type: "string"
        notes: "Plaintext secret shown once; unpersisted AS-IS"
      - name: "key_id"
        type: "string"
      - name: "key_prefix"
        type: "string"
      - name: "key_sha256_hash"
        type: "string"
      - name: "role"
        type: "string"
        notes: "UserRole enum value; service currently has no ROLE_CAPABILITIES entry"
breaking_change_policy: "Backward-compatible additions allowed; claim renames require client & verifier lockstep update."
