schema_version: "2.0.0"
capability_id: "CAP-APP-IAM-001"
name: "Authentication, API Keys & Edge Defense"
plane: "application-plane"
domain: "identity-and-access"
owner_role: "security-architect"
accountable_role: "security-architect"
risk_tier: "HIGH_CRITICAL"
risk_signals:
  handles_auth_or_rbac: true
  handles_user_or_financial_data: true
  external_exposure: true
  schema_or_db_migration: true
  realtime_or_event_streaming: false
  agent_write_capable_tools: false
  cross_plane_dependencies: false
  exposes_http_api: true
scope: "Covers PBKDF2-HMAC-SHA256 hashing, HS256 IP-bound JWT issuance/verification/revocation, scoped API key generation, RBAC capability definitions, HTTP edge defense middleware, and Administration IAM panel."
in_scope:
  - "POST /api/v1/auth/token, /verify, /revoke, /api-keys and GET /api/v1/auth/domains"
  - "install_security_defense_middleware (Host header, WAF path/query regex, SlidingWindowRateLimiter, HSTS/CSP)"
  - "CredentialHasher, JwtSecurityService, UserRole & ROLE_CAPABILITIES"
  - "PostgreSQL users DDL (deploy/postgres/init/01_schema.sql) and TARGET api_keys storage"
  - "Frontend auth.service.ts & AdministrationModule IAM/Domain widgets"
out_of_scope:
  - "External OAuth2/OIDC Identity Provider federation (unimplemented)"
  - "AI Agent tool execution governance inside Intelligence Plane (CAP-INT-ORC-001)"
