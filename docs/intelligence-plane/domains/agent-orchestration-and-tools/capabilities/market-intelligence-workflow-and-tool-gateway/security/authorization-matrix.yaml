    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool()"
    implementation_gap: "Caller JWT role is not propagated."

  - principal: "MarketIntelligenceGraph (AS-IS hardcoded agent identity)"
