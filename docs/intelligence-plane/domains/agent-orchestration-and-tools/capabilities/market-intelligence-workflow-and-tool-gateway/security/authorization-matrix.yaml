as_is_enforcement_note: "MarketIntelligenceGraph hardcodes _agent_permissions = {'market:read', 'historical:read', 'analytics:read', 'agent:trigger'} regardless of HTTP caller role."

tool_permission_matrix:
  - principal: "MarketIntelligenceGraph (AS-IS hardcoded agent identity)"
    tool: "get_latest_price"
    permission: "market:read"
    data_scope: "Single symbol hot quote (max 1 row)"
    access_mode: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool()"
    implementation_gap: "Caller JWT role is not propagated into _agent_permissions."

  - principal: "MarketIntelligenceGraph (AS-IS hardcoded agent identity)"
    tool: "get_market_snapshot"
    permission: "market:read"
    data_scope: "Single symbol 24h snapshot (max 1 row)"
