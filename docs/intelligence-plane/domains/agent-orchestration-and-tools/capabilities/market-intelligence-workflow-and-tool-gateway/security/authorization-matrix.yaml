schema_version: "2.0.0"
capability_id: "CAP-INT-ORC-001"
owner_role: "security-architect"
document_status: "DRAFT"
implementation_status: "PARTIALLY_IMPLEMENTED"
default_policy: "DENY_BY_DEFAULT"
as_is_authorization_note: "AS-IS WARNING: MarketIntelligenceGraph hardcodes self._agent_permissions = frozenset({'market:read', 'historical:read', 'analytics:read', 'agent:trigger'}) in graph.py:117 and HTTP trigger routes in CAP-APP-AGT-001 have zero JWT Depends guards. User-based authorization is NOT implemented."

rules:
  - rule_id: "AUTHZ-INT-001"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS hardcoded internal principal) | role:analyst / role:operator / role:admin (TARGET)"
    tool: "get_latest_price"
    permission: "market:read"
    data_scope: "Hot price & staleness for monitored spot symbol (provider hardcoded 'binance' AS-IS)"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks policy.required_permission against hardcoded _agent_permissions"
    implementation_gap: "Caller identity not propagated; provider param ignored; unauthenticated HTTP callers reach workflow."

  - rule_id: "AUTHZ-INT-002"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "get_market_snapshot"
    permission: "market:read"
    data_scope: "24h ticker snapshot in HotStateProjector._snapshot_store"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool()"
    implementation_gap: "Caller identity not propagated; declared ClickHouse fallback unimplemented."

  - rule_id: "AUTHZ-INT-003"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "get_historical_candles"
    permission: "historical:read"
    data_scope: "Up to 500 OHLCV klines in ClickHouseBatchSink (AS-IS fixed 7d window)"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks historical:read and limit <= 500"
    implementation_gap: "Caller identity not propagated; limit <= 0 unchecked; start_time/end_time params ignored by handler."

  - rule_id: "AUTHZ-INT-004"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "get_market_statistics"
    permission: "analytics:read"
    data_scope: "Aggregated VWAP, volume, trade_count in ClickHouseBatchSink"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks analytics:read"
    implementation_gap: "Caller identity not propagated; reads in-memory dict rather than ClickHouse MV."

  - rule_id: "AUTHZ-INT-005"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "calculate_returns"
    permission: "analytics:read"
    data_scope: "Up to 720 close prices -> deterministic log returns"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks analytics:read and lookback_periods <= 720"
    implementation_gap: "Caller identity not propagated; handler ignores lookback_periods slicing and silently uses static fallback array."

  - rule_id: "AUTHZ-INT-006"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "calculate_volatility"
    permission: "analytics:read"
    data_scope: "Up to 720 close prices -> annualized realized volatility"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks analytics:read and lookback_periods <= 720"
    implementation_gap: "Caller identity not propagated; handler ignores lookback_periods slicing and silently uses static fallback array."

  - rule_id: "AUTHZ-INT-007"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "calculate_correlation"
    permission: "analytics:read"
    data_scope: "Up to 2160 periods across 2 symbols -> Pearson correlation"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks analytics:read and lookback_periods <= 2160"
    implementation_gap: "Caller identity not propagated; static fallback arrays mask missing symbol data."

  - rule_id: "AUTHZ-INT-008"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "detect_anomalies"
    permission: "analytics:read"
    data_scope: "Up to 168 periods -> Z-score evaluation; MUTATES global cooldown registry & runtime.detected_anomalies"
    access_type: "READ_WITH_STATE_MUTATION"
    approval_requirement: "NONE_AS_IS (TARGET: separate dry-run read vs alert write OR require explicit side-effect control)"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks analytics:read and lookback_periods <= 168"
    implementation_gap: "Declared permission is analytics:read and is_read_only_market_data=True despite mutating shared 900s cooldown and detected_anomalies list."

  - rule_id: "AUTHZ-INT-009"
    principal_or_actor: "MarketIntelligenceGraph (AS-IS) | role:analyst+ (TARGET)"
    tool: "get_data_freshness"
    permission: "market:read"
    data_scope: "Latest price lag_ms & staleness health boolean"
    access_type: "READ"
    approval_requirement: "NONE"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks market:read"
    implementation_gap: "Caller identity not propagated; returns identical lag_ms for both Redis and ClickHouse."

  - rule_id: "AUTHZ-INT-010"
    principal_or_actor: "MarketIntelligenceGraph Node 5 (AS-IS) | role:analyst / role:operator / role:admin / system-worker (TARGET)"
    tool: "generate_analysis_report"
    permission: "agent:trigger"
    data_scope: "Writes StructuredAnalysisReport keyed by run_id into runtime.reports (TARGET: Postgres agent_runs.structured_report)"
    access_type: "WRITE"
    approval_requirement: "SYSTEM_PROVENANCE_GATE (ReportValidator must pass; no human approval gate AS-IS or planned for report creation)"
    current_enforcement_point: "ControlledToolGateway.execute_tool() checks agent:trigger against hardcoded _agent_permissions; Node 5 calls ReportValidator first"
    implementation_gap: "ToolGovernancePolicy.is_read_only_market_data=True bug; planner could theoretically call tool directly if external LLM selects it; caller role:viewer is NOT blocked at HTTP ingress."

  - rule_id: "AUTHZ-INT-011"
    principal_or_actor: "role:viewer (TARGET) | unauthenticated caller (AS-IS)"
    tool: "generate_analysis_report (or POST /api/v1/agents/runs)"
    permission: "agent:trigger (NOT in VIEWER ROLE_CAPABILITIES)"
    data_scope: "Investigation execution & report persistence"
    access_type: "WRITE"
    approval_requirement: "DENIED"
    current_enforcement_point: "ControlledToolGateway unit test rejects missing agent:trigger when passed manually; HTTP & Graph do NOT enforce viewer restriction AS-IS"
    implementation_gap: "SEC-AUDIT-003 + hardcoded _agent_permissions allow any unauthenticated or VIEWER caller to execute agent runs."

