scope: "Executes the 5-node quantitative market investigation workflow, enforces the 10-tool ControlledToolGateway firewall (whitelist, permission check, row caps, timeouts, provenance), runs ReportValidator, and defines target worker/Postgres persistence contracts."
in_scope:
  - "MarketIntelligenceGraph 5-node loop & DeterministicMockLLMAdapter (AS-IS) / external LLM adapter (TARGET)"
  - "AgentWorkflowState lifecycle, iteration bounds, and planning token ceiling"
  - "ControlledToolGateway 10-tool registry, RBAC permission check, query bounds, timeout, and audit log"
  - "ReportValidator invocation_id provenance verification"
  - "PostgreSQL agent_runs & agent_tool_invocations schema alignment & agent-worker entrypoint"
out_of_scope:
  - "FastAPI /api/v1/agents/* & /api/v1/reports/* HTTP/SSE endpoints & AiWorkspaceModule UI (CAP-APP-AGT-001)"
  - "User authentication, JWT issuance, API keys & edge WAF/rate limiting (CAP-APP-IAM-001)"
  - "Market data ingestion, Kafka bus & market.anomalies.v1 producer schema (CAP-DP-ING-001, CAP-DP-STR-001, CAP-DP-STR-002)"
dependencies:
  capabilities: ["CAP-DP-STR-002", "CAP-APP-AGT-001"]
