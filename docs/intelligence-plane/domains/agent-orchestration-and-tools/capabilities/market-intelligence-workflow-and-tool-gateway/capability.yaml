  - "OPEN-INT-004: Align run_id format (run_<hex12> vs UUID) and add idempotency_key/node columns to PostgreSQL agent_runs DDL."
  - "OPEN-INT-005: Establish approved latency, timeout, token cost, and availability SLOs via benchmark once async worker is active."
