    - "docs/intelligence-plane/shared-contracts/data-contract.yaml"
    - "docs/data-plane/shared-contracts/asyncapi.yaml"
  external_systems:
    - "PostgreSQL 16 (deploy/postgres/init/01_schema.sql — UNWIRED AS-IS)"
    - "External LLM Provider API (TARGET only; AS-IS uses DeterministicMockLLMAdapter)"
