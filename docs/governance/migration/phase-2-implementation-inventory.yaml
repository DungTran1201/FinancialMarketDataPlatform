      - "src/ingestion/infrastructure/watermark_store.py"
      - "src/ingestion/providers/binance/normalizer.py"
      - "src/ingestion/providers/binance/rest_client.py"
      - "src/ingestion/entrypoints/ws_collector.py"
      - "src/ingestion/entrypoints/rest_backfill.py"
    entrypoint: "Called in-process via DataPlatformV01Pipeline & PlatformRuntimeContainer (ws_collector.py & rest_backfill.py main() exit immediately)"
    inputs: ["Raw Binance WS dict frames", "Backfill request parameters (symbol, interval, time window)"]
    outputs: ["EventEnvelopeV1", "DeadLetterEnvelopeV1", "ExchangeSymbolMetadata", "SQLite ingestion_watermarks rows"]
    dependencies: ["CMP-SHD-001", "CMP-DP-STR-001"]
    external_integrations:
      - "Binance REST https://api.binance.com (embedded ASGI sim active by default; live HTTP unused unless use_embedded_asgi_transport=False)"
      - "Binance WS wss://stream.binance.com:9443/ws (NOT_IMPLEMENTED in src/)"
    persistence: "SQLite WAL file .local_storage/control_watermarks.db (schema differs from deploy/postgres/init/01_schema.sql)"
    test_coverage:
      - "tests/unit/test_domain_and_quant.py"
      - "tests/resilience/test_gap_recovery_and_dlq.py"
      - "tests/e2e/test_data_platform_v01_e2e.py"
    runtime_mode: "EMBEDDED_ASGI_SIMULATOR + LOCAL_SQLITE + STUB_WORKER_ENTRYPOINTS"
    error_handling: "Routes normalization errors to DeadLetterEnvelopeV1; REST retries HTTP 429/418/>=500 with backoff; SequenceAndGapDetector triggers BACKFILLING watermark"
    security_boundaries: ["Outbound HTTPS Binance public endpoints only (no authenticated private exchange endpoints implemented)"]
    implementation_status: "PARTIALLY_IMPLEMENTED"
    evidence: "src/ingestion/providers/binance/rest_client.py:108-120; entrypoints/{ws_collector,rest_backfill}.py; watermark_store.py"

