    responsibility: "Normalizes Binance JSON trade/kline/ticker/depth20 payloads into EventEnvelopeV1 or DeadLetterEnvelopeV1, executes paginated REST kline backfill with weight rate limiting, detects WS kline gaps, and persists watermarks."
    source_paths:
      - "src/ingestion/domain/models.py"
      - "src/ingestion/domain/ports.py"
      - "src/ingestion/application/rate_limiter.py"
      - "src/ingestion/application/backfill_service.py"
