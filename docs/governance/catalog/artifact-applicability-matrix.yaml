# Documentation V2 Artifact Applicability Matrix
# Validated against docs/governance/schemas/artifact-applicability-matrix.schema.json
schema_version: "2.0.0"
doc_id: "GOV-CAT-MAT-001"
title: "Documentation V2 Risk-Based Artifact Applicability Matrix"
status: "APPROVED"
owner_role: "documentation-architect"
accountable_role: "documentation-architect"
updated_at: "2026-11-16"

applicability_classes:
  - code: "REQUIRED"
    meaning: "MUST be produced, populated cleanly, and pass automated & human gate review before capability approval."
  - code: "CONDITIONAL"
    meaning: "REQUIRED when specific technical signals, work types, or complexity predicates apply; otherwise omit or document NOT_APPLICABLE_WITH_REASON."
  - code: "RECOMMENDED"
    meaning: "Strongly advised when clarity or onboarding benefits justify authoring; MAY be omitted without blocking approval."
  - code: "NOT_APPLICABLE_WITH_REASON"
    meaning: "Not required under the current risk tier/signals; MUST NOT be created as an empty file, and MUST record a brief non-empty reason in capability.yaml when explicitly waived."

risk_assessment:
  tiers:
    - tier: "LOW"
      description: "Read-only UI/presentation components, static configuration views, internal formatting utilities, or non-sensitive read-only lookups without schema migrations, streaming mutations, external exposure changes, or agent side effects."
      default_review_depth: "Standard peer + single accountable owner review."
    - tier: "MEDIUM"
      description: "Standard API endpoints, analytical query extensions, database schema changes without auth changes, batch transformations, or internal service integrations with moderate blast radius."
      default_review_depth: "Accountable owner + cross-domain (architect/DB/QA) review."
    - tier: "HIGH_CRITICAL"
      description: "Authentication/RBAC/session handling, financial calculation or integrity pipelines, external internet-facing endpoints, real-time Kafka/WebSocket streaming ingestion/fan-out, write-capable AI agent tools, or multi-plane breaking changes."
      default_review_depth: "Full RACI sign-off including mandatory Security Architect gate (QG-4) and QA verification gate (QG-6)."
  assessment_signals:
    - signal: "handles_auth_or_rbac"
      minimum_tier: "HIGH_CRITICAL"
      description: "Capability authenticates principals, validates tokens, enforces RBAC/permissions, or alters user sessions."
    - signal: "handles_user_or_financial_data"
      minimum_tier: "MEDIUM"
      description: "Capability stores, computes, or exposes OHLCV market precision, user profiles, audit trails, or proprietary scores."
    - signal: "external_exposure"
      minimum_tier: "HIGH_CRITICAL"
      description: "Capability exposes public/edge routes or connects directly to untrusted third-party APIs/WebSockets."
    - signal: "schema_or_db_migration"
      minimum_tier: "MEDIUM"
      description: "Capability creates or modifies persistent database tables, engines, indexes, partitions, or storage schemas."
    - signal: "realtime_or_event_streaming"
      minimum_tier: "HIGH_CRITICAL"
      description: "Capability produces, transforms, consumes, or streams continuous real-time Kafka/WebSocket/SSE data."
    - signal: "agent_write_capable_tools"
      minimum_tier: "HIGH_CRITICAL"
      description: "Capability exposes LLM/Agent tools capable of mutating files, state, external calls, or persistent records."
    - signal: "cross_plane_dependencies"
      minimum_tier: "MEDIUM"
      description: "Capability crosses or depends synchronously/asynchronously on contracts owned by another architectural plane."

