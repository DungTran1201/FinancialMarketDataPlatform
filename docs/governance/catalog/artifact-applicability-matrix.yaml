signal_overrides:
  - signal: "handles_auth_or_rbac"
    enforce_minimum_tier: "HIGH_CRITICAL"
    required_artifacts:
      - "ART-THREAT-MODEL"
      - "ART-SEC-REQ"
      - "ART-AUTHZ-MATRIX"
      - "ART-DIAG-TM"
      - "ART-OPENAPI"
      - "ART-ERR-CAT"
      - "ART-DIAG-SEQ"
      - "ART-TEST-CASES"
      - "ART-TRACEABILITY"
    rationale: "Authentication, session, JWT, and RBAC logic carry critical privilege escalation and bypass risks."

  - signal: "handles_user_or_financial_data"
    enforce_minimum_tier: "MEDIUM"
    required_artifacts:
      - "ART-BUS-RULE"
      - "ART-DATA-CONTRACT"
      - "ART-TEST-CASES"
      - "ART-TRACEABILITY"
    rationale: "Financial market prices, OHLCV precision, and sensitive user records require strict decimal, contract, and verification traceability."

  - signal: "external_exposure"
    enforce_minimum_tier: "HIGH_CRITICAL"
    required_artifacts:
      - "ART-THREAT-MODEL"
      - "ART-SEC-REQ"
      - "ART-DIAG-TM"
      - "ART-OPENAPI"
      - "ART-ERR-CAT"
      - "ART-OBS-SLO"
    rationale: "Externally exposed endpoints and ingress adapters enlarge the untrusted attack surface."

  - signal: "schema_or_db_migration"
    enforce_minimum_tier: "MEDIUM"
    required_artifacts:
      - "ART-DATA-MODEL"
      - "ART-DB-DESIGN"
      - "ART-DIAG-ERD"
      - "ART-RUNBOOK"
      - "ART-INC-REC"
      - "ART-TEST-CASES"
      - "ART-TRACEABILITY"
    rationale: "Persistent storage changes require clear key/index contracts, safe DDL evolution, and deterministic rollback plans."

  - signal: "realtime_or_event_streaming"
    enforce_minimum_tier: "HIGH_CRITICAL"
    required_artifacts:
      - "ART-ASYNCAPI"
      - "ART-DATA-CONTRACT"
      - "ART-DIAG-DFD"
      - "ART-ERR-CAT"
      - "ART-OBS-SLO"
      - "ART-INC-REC"
      - "ART-RUNBOOK"
      - "ART-TEST-CASES"
      - "ART-TRACEABILITY"
    rationale: "Streaming ingestion and event pipelines require explicit envelope schemas, partitioning keys, lag/freshness SLIs, DLQ rules, and replay recovery."

  - signal: "agent_write_capable_tools"
    enforce_minimum_tier: "HIGH_CRITICAL"
    required_artifacts:
      - "ART-AGENT-SPEC"
      - "ART-DIAG-AGENT"
      - "ART-THREAT-MODEL"
      - "ART-SEC-REQ"
      - "ART-AUTHZ-MATRIX"
      - "ART-DIAG-TM"
      - "ART-TEST-CASES"
      - "ART-TRACEABILITY"
    rationale: "Autonomous agent tools capable of state mutation require explicit human-approval rules, permission matrices, loop budgets, and evaluation harnesses."

  - signal: "cross_plane_dependencies"
    enforce_minimum_tier: "MEDIUM"
    required_artifacts:
      - "ART-NFR-SPEC"
      - "ART-DIAG-C4"
      - "ART-TRACEABILITY"
    rationale: "Cross-plane interfaces require explicit contract ownership and dependency impact tracking."

plane_overrides:
  intelligence-plane:
    additional_required_if_agent_capability:
      - "ART-AGENT-SPEC"
      - "ART-DIAG-AGENT"
  application-plane:
    recommended_for_http_capabilities:
      - "ART-OPENAPI"
      - "ART-ERR-CAT"
  data-plane:
    recommended_for_pipeline_capabilities:
      - "ART-DATA-CONTRACT"
      - "ART-DIAG-DFD"

scenario_profiles:
  - scenario_id: "SCEN-UI-READONLY"
    description: "Simple read-only frontend UI component displaying verified read API fields."
    expected_tier: "LOW"
    signals:
      handles_auth_or_rbac: false
      handles_user_or_financial_data: false
      external_exposure: false
      schema_or_db_migration: false
      realtime_or_event_streaming: false
      agent_write_capable_tools: false
      cross_plane_dependencies: false
    required_artifacts:
      - "ART-CAP-MANIFEST"
      - "ART-CAP-SPEC"
      - "ART-COMP-DESIGN"
      - "ART-TEST-CASES"
      - "ART-TRACEABILITY"
    waived_with_reason_artifacts:
      - "ART-DATA-MODEL"
      - "ART-DB-DESIGN"
      - "ART-DIAG-ERD"
      - "ART-ASYNCAPI"
      - "ART-THREAT-MODEL"
      - "ART-AGENT-SPEC"
      - "ART-INC-REC"

  - scenario_id: "SCEN-AUTH-RBAC"
    description: "Authentication or authorization/RBAC change."
    expected_tier: "HIGH_CRITICAL"
    signals:
      handles_auth_or_rbac: true
      handles_user_or_financial_data: true
      external_exposure: true
      schema_or_db_migration: false
      realtime_or_event_streaming: false
      agent_write_capable_tools: false
      cross_plane_dependencies: false
    minimum_additional_required:
      - "ART-THREAT-MODEL"
      - "ART-SEC-REQ"
      - "ART-AUTHZ-MATRIX"
      - "ART-DIAG-TM"
      - "ART-OPENAPI"
      - "ART-ERR-CAT"
      - "ART-DIAG-SEQ"

  - scenario_id: "SCEN-DB-MIGRATION"
    description: "Database schema migration across transactional or analytical storage."
    expected_tier: "MEDIUM"
    signals:
      handles_auth_or_rbac: false
      handles_user_or_financial_data: false
      external_exposure: false
      schema_or_db_migration: true
      realtime_or_event_streaming: false
      agent_write_capable_tools: false
      cross_plane_dependencies: false
    minimum_additional_required:
      - "ART-DATA-MODEL"
      - "ART-DB-DESIGN"
      - "ART-DIAG-ERD"
      - "ART-RUNBOOK"
      - "ART-INC-REC"

  - scenario_id: "SCEN-REALTIME-STREAMING"
    description: "Real-time market data streaming ingestion or Kafka fan-out pipeline."
    expected_tier: "HIGH_CRITICAL"
    signals:
      handles_auth_or_rbac: false
      handles_user_or_financial_data: true
      external_exposure: false
      schema_or_db_migration: false
      realtime_or_event_streaming: true
      agent_write_capable_tools: false
      cross_plane_dependencies: true
    minimum_additional_required:
      - "ART-ASYNCAPI"
      - "ART-DATA-CONTRACT"
      - "ART-BUS-RULE"
      - "ART-DIAG-DFD"
      - "ART-OBS-SLO"
      - "ART-INC-REC"

  - scenario_id: "SCEN-AGENT-WRITE-TOOL"
    description: "AI agent tool capable of mutating state or triggering write actions."
    expected_tier: "HIGH_CRITICAL"
    signals:
      handles_auth_or_rbac: false
      handles_user_or_financial_data: false
      external_exposure: false
      schema_or_db_migration: false
      realtime_or_event_streaming: false
      agent_write_capable_tools: true
      cross_plane_dependencies: true
    minimum_additional_required:
      - "ART-AGENT-SPEC"
      - "ART-DIAG-AGENT"
      - "ART-THREAT-MODEL"
      - "ART-SEC-REQ"
      - "ART-AUTHZ-MATRIX"
      - "ART-DIAG-TM"

