    owner_role: "system-architect"
    accountable_role: "system-architect"
    template_path: "docs/governance/templates/architecture/adr.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform", "plane", "capability"]
    applicable_planes: ["platform", "data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["platform-baseline", "plane-architecture", "major-scope-change", "security-change", "schema-migration"]
    preconditions: ["Material decision with alternatives and long-lived trade-offs identified."]
    required_related_artifacts: []
    validation_rules: ["VAL-FM-001", "VAL-ID-UNIQUE-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-3-SPEC-DESIGN"
      approvers: ["system-architect"]

  - artifact_id: "ART-AGENT-SPEC"
