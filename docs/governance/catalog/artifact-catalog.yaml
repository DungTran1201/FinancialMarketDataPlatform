    validation_rules: ["VAL-ASYNCAPI-001", "VAL-LINK-001"]
    approval_requirements:
      gate: "QG-3-SPEC-DESIGN"
      approvers: ["data-architect"]

  - artifact_id: "ART-ERR-CAT"
