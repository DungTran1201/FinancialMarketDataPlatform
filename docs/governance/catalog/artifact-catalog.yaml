# Documentation V2 Artifact Catalog
# Validated against docs/governance/schemas/artifact-catalog.schema.json
schema_version: "2.0.0"
doc_id: "GOV-CAT-ART-001"
title: "Documentation V2 Canonical Artifact Catalog"
status: "APPROVED"
owner_role: "documentation-architect"
accountable_role: "documentation-architect"
updated_at: "2026-11-16"

artifacts:
  - artifact_id: "ART-ROOT-README"
    name: "Scoped Directory README Index"
    purpose: "Defines scope, ownership, navigation links, and entrypoints for a plane, domain, capability, or subsystem directory."
    owner_role: "documentation-architect"
    accountable_role: "documentation-architect"
    template_path: "docs/governance/templates/common/readme.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform", "plane", "domain", "capability", "governance"]
    applicable_planes: ["platform", "data-plane", "application-plane", "intelligence-plane", "governance"]
    applicable_work_types: ["new-capability", "plane-architecture", "doc-refactoring"]
    preconditions: ["Target directory exists cleanly without empty speculative subtrees."]
    required_related_artifacts: []
    validation_rules: ["VAL-FM-001", "VAL-LINK-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-1-SCOPE"
      approvers: ["documentation-architect"]

  - artifact_id: "ART-GLOSSARY"
    name: "Domain & Platform Ubiquitous Glossary Entry"
    purpose: "Establishes unambiguous domain terminology, code symbol alignment, and disallowed synonyms."
    owner_role: "business-analyst"
    accountable_role: "documentation-architect"
    template_path: "docs/governance/templates/common/glossary-entry.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform", "plane", "domain"]
    applicable_planes: ["platform", "data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "domain-modeling", "doc-refactoring"]
    preconditions: ["Authoritative domain terms extracted from verified code or stakeholder input."]
    required_related_artifacts: ["ART-DOM-SPEC"]
    validation_rules: ["VAL-FM-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst"]

  - artifact_id: "ART-CAP-MANIFEST"
    name: "Capability Manifest (capability.yaml)"
    purpose: "Machine-readable declaration of capability ownership, risk tier, technical signals, applicability decisions, code/test paths, and blockers."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/capability.template.yaml"
    schema_path: "docs/governance/schemas/capability-manifest.schema.json"
    scope_levels: ["capability"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "feature-enhancement", "security-change", "schema-migration", "api-contract-change", "data-pipeline-change", "agent-tool-change"]
    preconditions: ["Parent domain exists and capability ownership is assigned."]
    required_related_artifacts: ["ART-CAP-SPEC"]
    validation_rules: ["VAL-CAP-SCHEMA-001", "VAL-CAP-MATRIX-001", "VAL-CAP-REASON-001"]
    approval_requirements:
      gate: "QG-1-SCOPE"
      approvers: ["business-analyst"]

  - artifact_id: "ART-PROD-BRIEF"
    name: "Product Brief & System Scope"
    purpose: "Captures top-level problem statement, business outcomes, in/out-of-scope boundaries, constraints, and unresolved scope questions."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/product-brief.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform"]
    applicable_planes: ["platform"]
    applicable_work_types: ["platform-baseline", "major-scope-change"]
    preconditions: ["Repository AS-IS audit completed."]
    required_related_artifacts: ["ART-SYS-REQS"]
    validation_rules: ["VAL-FM-001", "VAL-SEC-REQ-001", "VAL-TBD-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst"]

  - artifact_id: "ART-SYS-REQS"
    name: "System Business & Quality Requirements Index"
    purpose: "Records cross-platform BR/FR/NFR index linking down to owning plane and capability specifications."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/system-requirements.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform", "plane"]
    applicable_planes: ["platform", "data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["platform-baseline", "major-scope-change", "plane-architecture"]
    preconditions: ["Product Brief or Plane scope approved."]
    required_related_artifacts: ["ART-PROD-BRIEF"]
    validation_rules: ["VAL-FM-001", "VAL-ID-UNIQUE-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst"]

  - artifact_id: "ART-DOM-SPEC"
    name: "Domain Boundary Specification"
    purpose: "Defines bounded domain context, core concepts, cross-domain events, and owned capability inventory."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/domain-specification.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["domain"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["domain-modeling", "new-capability"]
    preconditions: ["Owning plane architecture defined."]
    required_related_artifacts: ["ART-ARCH-DESC"]
    validation_rules: ["VAL-FM-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst", "system-architect"]

  - artifact_id: "ART-CAP-SPEC"
    name: "Capability Specification"
    purpose: "Authoritative requirement specification for a single capability: BR/FR links, AS-IS vs. TARGET behavior, AC, dependencies, and open questions."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/capability-specification.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["capability"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "feature-enhancement", "security-change", "data-pipeline-change", "agent-tool-change"]
    preconditions: ["ART-CAP-MANIFEST exists cleanly."]
    required_related_artifacts: ["ART-CAP-MANIFEST", "ART-TRACEABILITY"]
    validation_rules: ["VAL-FM-001", "VAL-ID-UNIQUE-001", "VAL-SEC-REQ-001", "VAL-TBD-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst"]

  - artifact_id: "ART-USE-CASE"
    name: "Actor-Goal Use Case Specification"
    purpose: "Specifies triggers, preconditions, main flow, alternative flows, exception paths, and postconditions for actor interactions."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/use-case.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["capability", "use-case"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "feature-enhancement", "agent-tool-change"]
    preconditions: ["Parent capability FR IDs assigned."]
    required_related_artifacts: ["ART-CAP-SPEC"]
    validation_rules: ["VAL-FM-001", "VAL-ID-UNIQUE-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst"]

  - artifact_id: "ART-BUS-RULE"
    name: "Domain Business Rules & Constraints Catalog"
    purpose: "Documents deterministic formulas, decision tables, compliance invariants, and violation responses."
    owner_role: "business-analyst"
    accountable_role: "business-analyst"
    template_path: "docs/governance/templates/product-and-requirements/business-rules.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["domain", "capability"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "feature-enhancement", "data-pipeline-change", "security-change"]
    preconditions: ["Invariants identified from requirements or verified financial formulas."]
    required_related_artifacts: ["ART-CAP-SPEC"]
    validation_rules: ["VAL-FM-001", "VAL-ID-UNIQUE-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["business-analyst"]

  - artifact_id: "ART-WORKFLOW"
    name: "Cross-Actor Workflow Specification"
    purpose: "Models multi-step orchestration handoffs, decision gateways, compensating branches, and SLA/retry boundaries."
    owner_role: "business-analyst"
    accountable_role: "system-architect"
    template_path: "docs/governance/templates/product-and-requirements/workflow-specification.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["plane", "capability"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "data-pipeline-change", "agent-tool-change"]
    preconditions: ["Parent capability requirements or plane flows defined."]
    required_related_artifacts: ["ART-CAP-SPEC"]
    validation_rules: ["VAL-FM-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-3-SPEC-DESIGN"
      approvers: ["business-analyst", "system-architect"]

  - artifact_id: "ART-NFR-SPEC"
    name: "Non-Functional Requirements & Quality Targets"
    purpose: "Specifies measurable latency, throughput, availability, consistency, durability, and verification methods without unconfirmed SLA invention."
    owner_role: "business-analyst"
    accountable_role: "system-architect"
    template_path: "docs/governance/templates/product-and-requirements/nfr.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform", "plane", "capability"]
    applicable_planes: ["platform", "data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "data-pipeline-change", "agent-tool-change", "plane-architecture"]
    preconditions: ["Capability scope and runtime constraints identified."]
    required_related_artifacts: ["ART-CAP-SPEC"]
    validation_rules: ["VAL-FM-001", "VAL-ID-UNIQUE-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-2-REQS"
      approvers: ["system-architect", "devops-sre"]

  - artifact_id: "ART-ARCH-DESC"
    name: "Scoped Architecture Description (arc42-Adapted)"
    purpose: "Documents platform or plane context, building block dependency rules, runtime concepts, AS-IS vs. TARGET, and technical risks."
    owner_role: "system-architect"
    accountable_role: "system-architect"
    template_path: "docs/governance/templates/architecture/architecture-description.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["platform", "plane"]
    applicable_planes: ["platform", "data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["platform-baseline", "plane-architecture", "major-scope-change"]
    preconditions: ["Codebase and deployment configs inspected for AS-IS state."]
    required_related_artifacts: ["ART-DIAG-C4"]
    validation_rules: ["VAL-FM-001", "VAL-SEC-REQ-001", "VAL-TBD-001"]
    approval_requirements:
      gate: "QG-3-SPEC-DESIGN"
      approvers: ["system-architect"]

  - artifact_id: "ART-COMP-DESIGN"
    name: "Capability Component & Interface Design"
    purpose: "Translates capability requirements into module decomposition, Clean Architecture port boundaries, state transitions, and error handling."
    owner_role: "fullstack-engineer"
    accountable_role: "system-architect"
    template_path: "docs/governance/templates/architecture/component-design.template.md"
    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["capability", "component"]
    applicable_planes: ["data-plane", "application-plane", "intelligence-plane"]
    applicable_work_types: ["new-capability", "feature-enhancement", "api-contract-change", "data-pipeline-change"]
    preconditions: ["ART-CAP-SPEC authored."]
    required_related_artifacts: ["ART-CAP-SPEC"]
    validation_rules: ["VAL-FM-001", "VAL-SEC-REQ-001"]
    approval_requirements:
      gate: "QG-3-SPEC-DESIGN"
      approvers: ["system-architect"]

  - artifact_id: "ART-ADR"
    name: "Architecture Decision Record (MADR 4.0)"
