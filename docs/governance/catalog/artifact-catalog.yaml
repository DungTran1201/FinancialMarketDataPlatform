    schema_path: "docs/governance/schemas/document-frontmatter.schema.json"
    scope_levels: ["plane", "capability"]
    applicable_planes: ["intelligence-plane"]
    applicable_work_types: ["new-capability", "agent-tool-change", "security-change"]
