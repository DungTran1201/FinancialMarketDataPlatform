            manifest: "docs/data-plane/domains/lakehouse-analytics/capabilities/medallion-lakehouse-and-quality-gates/capability.yaml"
            diagram_dirs:
              - "docs/data-plane/domains/lakehouse-analytics/capabilities/medallion-lakehouse-and-quality-gates/data/"

  application_plane:
    id: "application-plane"
    path: "docs/application-plane/"
    readme: "docs/application-plane/README.md"
    architecture_dir: "docs/application-plane/architecture/"
    decisions_dir: "docs/application-plane/architecture/decisions/"
