version: "2.0"
metadata:
  name: "FinancialMarketDataPlatform Documentation V2 Map"
  description: "Maps Documentation V2 root entrypoints, Platform Overview, Three Planes, Domains, Capabilities, diagrams, and reusable templates."
  updated_at: "2026-11-16"
  authoritative_sources:
    - "docs/docs-index.yaml"
    - "docs/governance/documentation-architecture.md"
    - "docs/governance/catalog/artifact-catalog.yaml"

root_entrypoints:
  agent_contract: "AGENTS.md"
  docs_root: "docs/README.md"
  docs_index: "docs/docs-index.yaml"
  validator: "scripts/docs/validate_docs.py"
  validator_wrapper: "tools/validators/run_all.py"

governance:
  path: "docs/governance/"
  readme: "docs/governance/README.md"
  architecture: "docs/governance/documentation-architecture.md"
  standards_dir: "docs/governance/standards/"
  catalog: "docs/governance/catalog/artifact-catalog.yaml"
  applicability_matrix: "docs/governance/catalog/artifact-applicability-matrix.yaml"
  schemas_dir: "docs/governance/schemas/"
  templates_dir: "docs/governance/templates/"
  migration_dir: "docs/governance/migration/"
  template_categories:
    architecture: "docs/governance/templates/architecture/"
    common: "docs/governance/templates/common/"
    diagrams: "docs/governance/templates/diagrams/"
    interfaces_and_data: "docs/governance/templates/interfaces-and-data/"
    operations: "docs/governance/templates/operations/"
    product_and_requirements: "docs/governance/templates/product-and-requirements/"
    quality: "docs/governance/templates/quality/"
    security: "docs/governance/templates/security/"

overview:
  path: "docs/overview/"
  readme: "docs/overview/README.md"
  architecture_dir: "docs/overview/architecture/"
  decisions_dir: "docs/overview/architecture/decisions/"
  diagrams_dir: "docs/overview/diagrams/"

capability_structure:
  pattern: "docs/<plane>/domains/<domain>/capabilities/<capability>/"
  manifest: "capability.yaml"
  readme: "README.md"
  standard_subdirs:
    - "requirements/"
    - "use-cases/"
    - "workflows/"
    - "design/"
    - "contracts/"
    - "data/"
    - "security/"
    - "quality/"
  diagram_placement_policy: "Scoped diagrams MUST live in overview/diagrams/, <plane>/architecture/diagrams/, or capability design/, workflows/, security/, and data/ directories; never create a detached docs/diagrams/ root."

planes:
  data_plane:
    id: "data-plane"
    path: "docs/data-plane/"
    readme: "docs/data-plane/README.md"
    architecture_dir: "docs/data-plane/architecture/"
    decisions_dir: "docs/data-plane/architecture/decisions/"
    diagrams_dir: "docs/data-plane/architecture/diagrams/"
    shared_contracts_dir: "docs/data-plane/shared-contracts/"
    operations_dir: "docs/data-plane/operations/"
    code_roots:
      - "src/ingestion"
      - "src/streaming"
      - "src/lakehouse"
      - "src/shared/contracts"
    domains:
      market-data-ingestion:
        path: "docs/data-plane/domains/market-data-ingestion/"
        specification: "docs/data-plane/domains/market-data-ingestion/domain-specification.md"
        capabilities:
          - id: "CAP-DP-ING-001"
            slug: "exchange-realtime-and-backfill-ingestion"
            path: "docs/data-plane/domains/market-data-ingestion/capabilities/exchange-realtime-and-backfill-ingestion/"
            manifest: "docs/data-plane/domains/market-data-ingestion/capabilities/exchange-realtime-and-backfill-ingestion/capability.yaml"
            diagram_dirs:
              - "docs/data-plane/domains/market-data-ingestion/capabilities/exchange-realtime-and-backfill-ingestion/design/"
              - "docs/data-plane/domains/market-data-ingestion/capabilities/exchange-realtime-and-backfill-ingestion/workflows/"
              - "docs/data-plane/domains/market-data-ingestion/capabilities/exchange-realtime-and-backfill-ingestion/data/"
              - "docs/data-plane/domains/market-data-ingestion/capabilities/exchange-realtime-and-backfill-ingestion/security/"
      event-streaming:
        path: "docs/data-plane/domains/event-streaming/"
        specification: "docs/data-plane/domains/event-streaming/domain-specification.md"
        capabilities:
          - id: "CAP-DP-STR-001"
            slug: "kafka-event-bus-and-dlq"
            path: "docs/data-plane/domains/event-streaming/capabilities/kafka-event-bus-and-dlq/"
            manifest: "docs/data-plane/domains/event-streaming/capabilities/kafka-event-bus-and-dlq/capability.yaml"
            diagram_dirs:
              - "docs/data-plane/domains/event-streaming/capabilities/kafka-event-bus-and-dlq/design/"
              - "docs/data-plane/domains/event-streaming/capabilities/kafka-event-bus-and-dlq/security/"
          - id: "CAP-DP-STR-002"
            slug: "realtime-hot-state-and-olap-projection"
            path: "docs/data-plane/domains/event-streaming/capabilities/realtime-hot-state-and-olap-projection/"
            manifest: "docs/data-plane/domains/event-streaming/capabilities/realtime-hot-state-and-olap-projection/capability.yaml"
            diagram_dirs:
