processes:
  - id: "PROC-001"
    name: "Real-Time Market Streaming & Hot/OLAP Projection"
    trigger: "Binance WebSocket event frame arrival or POST /api/v1/market/ingest"
    actors: ["collector-ws", "kafka", "consumer-hot-redis", "consumer-analytics-ch"]
    related_requirements: ["FR-01", "FR-03", "FR-04", "FR-05"]
    diagram_id: "DIAG-DATA-005"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    status: "BASELINED"
    note: "Hot Redis and ClickHouse consumer classes work in-process; standalone collector-ws daemon is a startup stub while /api/v1/observability/live/probe and /api/v1/market/ingest drive active runtime flows."
  - id: "PROC-002"
    name: "Medallion Lakehouse Bronze-Silver-Gold Pipeline"
    trigger: "POST /api/v1/data-platform/v01/run or POST /api/v1/catalog/lakehouse/pipeline (scheduled Airflow DAG PLANNED)"
    actors: ["DataPlatformV01Pipeline", "BronzeParquetArchiver", "SilverLakehouseMergeEngine", "DataQualityGateEngine", "GoldLayerMartEngine"]
    planned_external_actors: ["airflow", "spark-worker", "great-expectations", "dbt-runner"]
    related_requirements: ["FR-06", "FR-07"]
    diagram_id: "DIAG-DATA-007"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    status: "BASELINED"
  - id: "PROC-003"
    name: "Agentic Anomaly Investigation Workflow"
    trigger: "On-demand POST /api/v1/agents/runs (automated market.anomalies.v1 consumer PLANNED)"
    actors: ["backend-api", "MarketIntelligenceGraph", "ControlledToolGateway"]
    planned_external_actors: ["agent-worker (cg.agent.anomaly.v1)"]
    related_requirements: ["FR-09"]
    diagram_id: "DIAG-SEQ-013"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    status: "BASELINED"
