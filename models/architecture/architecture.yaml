version: "1.0"

metadata:
  model_id: "MODEL-ARCH-001"
  name: "Three-Plane Platform Architecture Model"
  description: "Authoritative structural model of Plane A, Plane B, Plane C, and ADRs."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-12"
  owner: "architecture-modeler"
  source_documents:
    - "docs/architecture/00-architecture-overview.md"
    - "docs/architecture/02-system-container-architecture.md"

planes:
  - id: "PLANE-A"
    name: "Data Plane"
    responsibility: "Ingestion, Kafka streaming, Redis hot state, ClickHouse OLAP, and MinIO/Iceberg Lakehouse."
    depends_on_planes: []
  - id: "PLANE-B"
    name: "Application & Control Plane"
    responsibility: "FastAPI Modular Monolith, Auth/RBAC, PostgreSQL control state, and Apache Superset BI."
    depends_on_planes: ["PLANE-A"]
  - id: "PLANE-C"
    name: "Intelligence Plane"
    responsibility: "Isolated LangGraph Agent Orchestrator and Read-Only Controlled Tool Gateway."
    depends_on_planes: ["PLANE-A", "PLANE-B"]

