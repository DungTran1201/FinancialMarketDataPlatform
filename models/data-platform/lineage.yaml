  - upstream: "external.binance_ws_rest"
    downstream: "raw.market_trades"
    stage: "Stage 2-3"
    operator: "src/ingestion/providers/binance/normalizer.py"
  - upstream: "raw.market_klines"
    downstream: "bronze.market_klines"
    stage: "Stage 5"
    operator: "src/lakehouse/bronze/archiver.py"
  - upstream: "raw.market_trades"
    downstream: "bronze.market_trades"
    stage: "Stage 5"
    operator: "src/lakehouse/bronze/archiver.py"
  - upstream: "bronze.market_klines"
    downstream: "silver.market_klines"
    stage: "Stage 6"
    operator: "src/lakehouse/silver/merge_engine.py"
  - upstream: "bronze.market_trades"
    downstream: "silver.market_trades"
    stage: "Stage 6"
    operator: "src/lakehouse/silver/merge_engine.py"
  - upstream: "silver.market_klines"
    downstream: "gold.fct_daily_market_summary"
