version: "1.0"

metadata:
  model_id: "MODEL-DP-002"
  name: "Canonical Event Envelope Contracts Model"
  description: "Versioned EventEnvelopeV1 and DeadLetterEnvelopeV1 specifications for Kafka streaming."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-15"
  updated_at: "2026-11-15"
  owner: "data-platform-architect"
  source_documents:
    - "docs/architecture/04-data-platform-architecture.md"
    - "docs/specifications/data-dictionary.md"

schema_version: "1.0.0"
idempotency_strategy: "UUIDv5(PLATFORM_EVENT_NAMESPACE, '{provider}:{event_type}:{symbol}:{natural_key}')"
partition_key_strategy: "'{provider}:{symbol}'"
contract_module: "src/shared/contracts/events/market_events.py"
envelope_fields:
  - "event_id"
  - "schema_version"
  - "provider"
  - "symbol"
  - "event_type"
  - "exchange_event_time"
  - "ingested_at"
  - "payload"
  - "sequence_id"
dlq_envelope_fields:
  - "dlq_id"
  - "source_provider"
  - "source_stream"
  - "error_type"
  - "error_message"
  - "raw_payload"
  - "failed_at"
schema_version_note: "EventEnvelopeV1 defaults schema_version='1.0.0' while src/shared/contracts/schemas/datasets.py SchemaVersion.V1 defaults to '1.0'."

events:
  - contract_name: "market.trade.v1"
    runtime_event_type: "trade"
    topic: "market.raw.trades.v1"
    payload_model: "MarketTradePayloadV1"
    payload_fields: ["trade_id", "price", "quantity", "quote_volume", "trade_time", "is_buyer_maker", "buyer_order_id", "seller_order_id"]
    numeric_precision: "Decimal fixed-point"
    implementation_status: "IMPLEMENTED"
  - contract_name: "market.kline.v1"
    runtime_event_type: "kline"
    topic: "market.raw.klines.v1"
    payload_model: "MarketKlinePayloadV1"
    payload_fields: ["interval", "open_time", "close_time", "open_price", "high_price", "low_price", "close_price", "base_volume", "quote_volume", "trade_count", "taker_buy_base_volume", "taker_buy_quote_volume", "is_closed"]
    numeric_precision: "Decimal fixed-point"
    implementation_status: "IMPLEMENTED"
  - contract_name: "market.ticker.v1"
    runtime_event_type: "ticker"
    topic: "market.raw.tickers.v1"
    payload_model: "dict (ticker snapshot)"
    numeric_precision: "Decimal fixed-point"
    implementation_status: "IMPLEMENTED"
  - contract_name: "market.orderbook.v1"
    runtime_event_type: "order_book"
    topic: "market.raw.orderbook.v1"
    payload_model: "dict (top-N bids/asks)"
    numeric_precision: "Decimal fixed-point"
    implementation_status: "IMPLEMENTED"
  - contract_name: "market.anomaly.v1"
    runtime_event_type: "anomaly"
    topic: "market.anomalies.v1"
    payload_model: "DetectedMarketAnomaly"
    numeric_precision: "float z-score + UTC timestamp"
    implementation_status: "IMPLEMENTED"
  - contract_name: "market.dlq.v1"
    runtime_event_type: null
    topic: "market.dlq.v1"
    payload_model: "DeadLetterEnvelopeV1"
    numeric_precision: "raw payload preservation"
    implementation_status: "IMPLEMENTED"

