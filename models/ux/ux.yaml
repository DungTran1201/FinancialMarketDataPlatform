version: "1.0"

metadata:
  model_id: "MODEL-UX-001"
  name: "Product UX, Information Architecture & Frontend Experience Layer Model"
  description: "Canonical UX model defining navigation groups, screens (SCR-001..007), user flows (UX-001..002), and API bindings."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-15"
  owner: "ux-modeler"
  source_documents:
    - "docs/product/11-ux/README.md"
    - "docs/product/11-ux/screen-specifications.md"
    - "docs/product/11-ux/user-flows.md"

navigation_groups:
  - id: "NAV-001"
    name: "Frontend Experience Layer SPA"
    route_prefix: "/"
    allowed_roles: ["viewer", "analyst", "operator", "admin"]
    runtime_url_note: "Served via Docker Compose frontend:3000 mapped to host port 3001 (FRONTEND_PORT) and proxied at Edge Gateway https://fmdp.local/."

screens:
  - id: "SCR-001"
    name: "Legacy Server-Rendered Observatory UI (Decommissioned)"
    route: "/ui/data-flow (decommissioned)"
    module_path: "src/serving/api/gateway/ui.py (deleted)"
    implementation_status: "DEPRECATED"
    states: ["decommissioned", "retired"]
    bound_endpoints: []
    historical_endpoints: ["API-011", "API-012", "API-014", "API-015", "API-016", "API-017", "API-018", "API-019", "API-020", "API-021", "API-022"]
  - id: "SCR-002"
    name: "Experience Layer: Overview Dashboard"
    route: "/dashboard"
    module_path: "frontend/src/modules/dashboard/DashboardModule.ts"
    implementation_status: "IMPLEMENTED"
    states: ["active"]
    bound_endpoints: ["API-017", "API-018", "API-019", "API-020", "API-021", "API-022", "API-053", "API-054", "API-055", "API-056"]
    frontend_drift_ref: "PROP-APP-001 (observability.service.ts also calls POST /observability/stream/control which has no backend route)"
  - id: "SCR-003"
    name: "Experience Layer: Data Flow Observatory"
    route: "/data-flow"
    module_path: "frontend/src/modules/data-flow/DataFlowModule.ts"
    implementation_status: "IMPLEMENTED"
    states: ["active"]
    bound_endpoints: ["API-017", "API-018", "API-019", "API-020", "API-021", "API-022", "API-051", "API-052", "API-053", "API-054", "API-055", "API-056"]
  - id: "SCR-004"
    name: "Experience Layer: Market Analytics"
    route: "/market-analytics"
    module_path: "frontend/src/modules/market-analytics/MarketAnalyticsModule.ts"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    states: ["active"]
    bound_endpoints: ["API-001", "API-032", "API-004", "API-007", "API-036", "API-037"]
    frontend_drift_ref: "PROP-APP-001 (market.service.ts calls /market/price, /market/orderbook, /historical/klines query style instead of /{symbol}; analytics.service.ts calls /analytics/volatility and /analytics/correlation instead of /analytics/statistics/{symbol} and /analytics/correlations)"
  - id: "SCR-005"
    name: "Experience Layer: Data Management"
    route: "/data-management"
    module_path: "frontend/src/modules/data-management/DataManagementModule.ts"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    states: ["active"]
    bound_endpoints: ["API-039", "API-041", "API-042", "API-014", "API-046"]
    frontend_drift_ref: "PROP-APP-001 (catalog.service.ts calls unimplemented /catalog/datasets, /catalog/lineage, /catalog/data-quality instead of /data-platform/v01/lineage and /catalog/instruments)"
  - id: "SCR-006"
    name: "Experience Layer: AI Workspace"
    route: "/ai-workspace"
    module_path: "frontend/src/modules/ai-workspace/AiWorkspaceModule.ts"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    states: ["active"]
    bound_endpoints: ["API-008", "API-009", "API-043", "API-044", "API-045"]
    frontend_drift_ref: "PROP-APP-001 (agent.service.ts listRuns calls GET /api/v1/agents/runs which is not registered in backend monolith router)"
  - id: "SCR-007"
    name: "Experience Layer: Administration"
    route: "/administration"
    module_path: "frontend/src/modules/administration/AdministrationModule.ts"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    states: ["active"]
    bound_endpoints: ["API-026", "API-029"]
    frontend_drift_ref: "PROP-APP-001 (auth.service.ts calls unimplemented GET /auth/api-keys and DELETE /auth/api-keys/{id})"

user_flows:
  - id: "UX-001"
    name: "Real-Time Parallel Data Flow, Kafka Partition, Lakehouse & Event Trace Telemetry"
    actor: "Data Engineer / Operator / Quant Analyst"
    entry_screen: "SCR-003"
    steps:
      - "Subscribe to /api/v1/observability/stream (API-055 SSE) or /ws/v1/observability/stream (API-056 WebSocket)."
      - "Inspect parallel post-Kafka flow topology (Redis Hot State || ClickHouse OLAP || Bronze->Silver->Gold) via zoomable SVG DAG (API-018)."
      - "Inspect Kafka broker truth (1-node KRaft active vs Brokers 2 & 3 UNAVAILABLE), topic partitions, and consumer group lag (API-019)."
      - "Explore .local_lakehouse Bronze Parquet files, Silver Iceberg v2 manifests, Gold marts, and ClickHouse/Redis buffers (API-020)."
      - "Analyze non-summed parallel-branch percentiles (API-021), Decimal OHLCV candlesticks (API-052), and event traces (API-022, API-051)."
  - id: "UX-002"
    name: "Multi-Module Vite/TypeScript SPA Navigation Workflow"
    actor: "Viewer / Analyst / Operator / Admin"
    entry_screen: "SCR-002"
    steps:
      - "Open Overview Dashboard (/dashboard, SCR-002) for platform KPIs and telemetry summary."
      - "Navigate via MainLayout sidebar across Data Flow (SCR-003), Market Analytics (SCR-004), Data Management (SCR-005), AI Workspace (SCR-006), and Administration (SCR-007)."
