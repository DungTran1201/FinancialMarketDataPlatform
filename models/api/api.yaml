version: "1.0"

metadata:
  model_id: "MODEL-API-001"
  name: "Platform REST, WebSocket & SSE API Catalog"
  description: "Canonical catalog of all 55 implemented FastAPI monolith routes plus 1 preserved planned route (API-003) and 7 domain microservice entrypoints."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-15"
  owner: "api-architect"
  source_documents:
    - "docs/specifications/api-specification.md"
    - "docs/architecture/09-api-and-integration-architecture.md"
  runtime_notes:
    monolith_entrypoint: "src/serving/api/main.py"
    openapi_docs_url: "/api/docs"
    openapi_schema_url: "/api/openapi.json"
    rate_limit_middleware: "SlidingWindowRateLimiter (src/shared/security/primitives.py): AUTH=10/min (/api/v1/auth*), AGENT_TRIGGER=5/min (/api/v1/agents/runs*), HEAVY_ANALYTICS=30/min (/api/v1/analytics*), MARKET_READ=120/min (all other paths)."
    rbac_note: "auth_role expresses the target RBAC policy (UserRole). Runtime JWT/API-key token issuance is active on /api/v1/auth/*, whereas per-route RBAC dependency enforcement on domain routers is PARTIALLY_IMPLEMENTED (tracked in PROP-APP-004)."

