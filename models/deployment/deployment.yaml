version: "1.0"

metadata:
  model_id: "MODEL-DEP-001"
  name: "Docker Compose Profiled Deployment Model"
  description: "Canonical model of Compose profiles (core, intelligence, lakehouse, observability, bi) and isolated networks."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-12"
  owner: "architecture-modeler"
  source_documents:
    - "docs/architecture/12-deployment-architecture.md"
    - "docker-compose.yml"

profiles:
  - id: "DEP-001"
    name: "core"
    services: ["postgres", "redis", "kafka", "clickhouse", "collector-ws", "consumer-hot-redis", "consumer-analytics-ch", "backend-api"]
  - id: "DEP-002"
    name: "intelligence"
    services: ["agent-worker"]
  - id: "DEP-003"
    name: "lakehouse"
    services: ["minio"]
  - id: "DEP-004"
    name: "observability"
    services: ["prometheus", "grafana"]
  - id: "DEP-005"
    name: "bi"
    services: ["superset"]

networks:
  - name: "frontend_net"
    trust_zone: "ZONE-2"
  - name: "app_control_net"
    trust_zone: "ZONE-3"
  - name: "data_plane_net"
    trust_zone: "ZONE-5"
