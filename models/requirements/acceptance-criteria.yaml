version: "1.0"

metadata:
  model_id: "MODEL-AC-001"
  name: "Canonical Acceptance Criteria Model"
  description: "Verifiable acceptance criteria linked to requirements and test cases."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-12"
  owner: "requirements-engineer"
  source_documents:
    - "docs/specifications/data-requirements.md"

acceptance_criteria:
  - id: "AC-001"
    requirement_id: "FR-03"
    given: "A raw market trade or kline event arrives from an exchange provider"
    when: "The collector normalizes and validates the event"
    then: "A deterministic UUIDv5 event_id and provider:symbol partition key are generated"
    test_case_refs: ["TC-001", "TC-002"]
    status: "BASELINED"
  - id: "AC-002"
    requirement_id: "FR-04"
    given: "Redis hot cache misses or is unreachable during GET /api/v1/market/prices/{symbol}"
    when: "MarketQueryHandler executes the query"
    then: "It transparently falls back to ClickHouse and returns source=clickhouse_fallback"
    test_case_refs: ["TC-003"]
    status: "BASELINED"
  - id: "AC-003"
    requirement_id: "FR-09"
    given: "An Agent attempts to invoke an unwhitelisted SQL tool or exceed row limits"
    when: "ControlledToolGateway evaluates the invocation"
    then: "The gateway rejects the call before touching any database"
    test_case_refs: ["TC-004"]
    status: "BASELINED"
