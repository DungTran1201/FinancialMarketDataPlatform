version: "1.0"

metadata:
  model_id: "MODEL-REQ-001"
  name: "Platform & Product Requirements Model"
  description: "Authoritative structured requirements model preserving baseline Data Platform FR-01..10."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-12"
  owner: "requirements-engineer"
  source_documents:
    - "docs/specifications/data-requirements.md"
    - "docs/specifications/non-functional-requirements.md"

capabilities:
  - id: "CAP-001"
    name: "Real-Time & Historical Market Data Ingestion"
    scope: "data_platform"
    status: "BASELINED"
  - id: "CAP-002"
    name: "Polyglot Hot, OLAP & Lakehouse Storage"
    scope: "data_platform"
    status: "BASELINED"
  - id: "CAP-003"
    name: "Isolated Agentic Market Intelligence"
    scope: "data_platform"
    status: "BASELINED"

functional_requirements:
  - id: "FR-01"
    capability_id: "CAP-001"
    title: "Streaming WebSocket Ingestion"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Collect real-time market events (Ticker, Trade, Kline, Order Book) from Binance WebSocket API."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-02"
    capability_id: "CAP-001"
    title: "Historical REST Synchronization & Backfill"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Collect and synchronize historical market data from Binance REST API with deterministic watermarks."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-03"
    capability_id: "CAP-001"
    title: "Multi-Provider Canonical Normalization"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Normalize incoming provider payloads into canonical EventEnvelopeV1 contracts."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-04"
    capability_id: "CAP-002"
    title: "Low-Latency Hot Data Serving"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Serve latest prices and snapshots from Redis with automatic ClickHouse fallback."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-05"
    capability_id: "CAP-002"
    title: "Historical & Analytical OLAP Serving"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Support bounded time-series queries over historical candles, trades, and statistics in ClickHouse."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-06"
    capability_id: "CAP-002"
    title: "Lakehouse Medallion Storage"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Persist Bronze, Silver, and Gold datasets in Apache Iceberg + Parquet over MinIO."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-07"
    capability_id: "CAP-002"
    title: "Data Quality & Lineage Enforcement"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Enforce schema validation at ingestion, deterministic deduplication, and Great Expectations assertions."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-08"
    capability_id: "CAP-002"
    title: "BI & Visualization Integration"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Expose curated analytical datasets in ClickHouse to Apache Superset."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-09"
    capability_id: "CAP-003"
    title: "Isolated Agentic Intelligence"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Provide an isolated LangGraph service accessing data solely through the Controlled Tool Gateway."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-10"
    capability_id: "CAP-002"
    title: "Platform Control & Governance"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    statement: "Manage users, RBAC roles, monitored instruments, watermarks, and audit logs in PostgreSQL."
    source_ref: "docs/specifications/data-requirements.md"

non_functional_requirements:
  - id: "NFR-001"
    category: "Performance"
    title: "Hot Latest Price Latency"
    target: "P50 <= 5ms, P95 <= 15ms, P99 <= 30ms"
    status: "BASELINED"
    source_ref: "docs/specifications/non-functional-requirements.md"
  - id: "NFR-002"
    category: "Performance"
    title: "Historical Candles Query Latency"
    target: "P50 <= 25ms, P95 <= 80ms, P99 <= 200ms"
    status: "BASELINED"
    source_ref: "docs/specifications/non-functional-requirements.md"
  - id: "NFR-003"
    category: "Reliability"
    title: "Plane Isolation & Graceful Degradation"
    target: "100% Data Plane uptime when Intelligence Plane or Redis is unavailable"
    status: "BASELINED"
    source_ref: "docs/specifications/non-functional-requirements.md"
