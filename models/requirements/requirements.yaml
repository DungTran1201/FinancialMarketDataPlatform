version: "1.0"

metadata:
  model_id: "MODEL-REQ-001"
  name: "Platform & Product Requirements Model"
  description: "Authoritative structured requirements model preserving baseline Data Platform FR-01..10 with factual implementation_status classification."
  status: "BASELINED"
  canonical_model: true
  created_at: "2026-11-12"
  updated_at: "2026-11-15"
  owner: "requirements-engineer"
  source_documents:
    - "docs/specifications/data-requirements.md"
    - "docs/specifications/non-functional-requirements.md"

capabilities:
  - id: "CAP-001"
    name: "Real-Time & Historical Market Data Ingestion"
    scope: "data_platform"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
  - id: "CAP-002"
    name: "Polyglot Hot, OLAP & Lakehouse Storage"
    scope: "data_platform"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
  - id: "CAP-003"
    name: "Isolated Agentic Market Intelligence"
    scope: "data_platform"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"

functional_requirements:
  - id: "FR-01"
    capability_id: "CAP-001"
    title: "Streaming WebSocket Ingestion"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Collect real-time market events (Ticker, Trade, Kline, Order Book) from Binance WebSocket API."
    implementation_evidence: "WebSocket connector and normalizer modules execute in-process and under POST /api/v1/market/ingest and POST /api/v1/observability/live/probe; standalone collector-ws daemon entrypoint is a startup stub."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-02"
    capability_id: "CAP-001"
    title: "Historical REST Synchronization & Backfill"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Collect and synchronize historical market data from Binance REST API with deterministic watermarks."
    implementation_evidence: "BinanceRestBackfillClient, WatermarkStore, and POST /api/v1/historical/backfill-jobs execute in-process; standalone collector-rest worker CLI and Airflow DAG scheduling are PLANNED."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-03"
    capability_id: "CAP-001"
    title: "Multi-Provider Canonical Normalization"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "IMPLEMENTED"
    statement: "Normalize incoming provider payloads into canonical EventEnvelopeV1 contracts."
    implementation_evidence: "Verified across EventEnvelopeV1, UUIDv5 idempotency keys, Decimal conversion, and DLQ routing (TC-001, TC-013, TC-014)."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-04"
    capability_id: "CAP-002"
    title: "Low-Latency Hot Data Serving"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "IMPLEMENTED"
    statement: "Serve latest prices and snapshots from Redis with automatic ClickHouse fallback."
    implementation_evidence: "MarketQueryHandler and Redis Lua monotonic guard with ClickHouse fallback implemented and verified in-process (TC-003, TC-015)."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-05"
    capability_id: "CAP-002"
    title: "Historical & Analytical OLAP Serving"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "IMPLEMENTED"
    statement: "Support bounded time-series queries over historical candles, trades, and statistics in ClickHouse."
    implementation_evidence: "ClickHouseBatchSink, BoundedTimeRange guards, and analytical endpoints (/api/v1/historical/*, /api/v1/analytics/*) implemented and tested in-process (TC-005, TC-016)."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-06"
    capability_id: "CAP-002"
    title: "Lakehouse Medallion Storage"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Persist Bronze, Silver, and Gold datasets in Parquet and Iceberg v2 manifests (targeting MinIO object storage)."
    implementation_evidence: "BronzeRawArchiver, SilverMergeEngine, and GoldLayerMartEngine write ZSTD Parquet and JSON Iceberg v2 manifests to .local_lakehouse/; MinIO S3 transport and live Iceberg REST catalog server remain PLANNED."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-07"
    capability_id: "CAP-002"
    title: "Data Quality & Lineage Enforcement"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Enforce schema validation at ingestion, deterministic deduplication, and Decimal quality assertions via DataQualityGateEngine (Great Expectations library integration PLANNED)."
    implementation_evidence: "DataQualityGateEngine (DQ-KLINE-001..005, DQ-TRADE-001..003) and DataLineageGovernanceRegistry execute in-process (TC-012); external Great Expectations library runtime is PLANNED."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-08"
    capability_id: "CAP-002"
    title: "BI & Visualization Integration"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Expose curated analytical datasets in ClickHouse to Apache Superset."
    implementation_evidence: "ClickHouse table DDL and Docker Compose superset service definition exist (--profile bi); automated Gold-to-ClickHouse sync and prebuilt Superset dashboards are PLANNED."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-09"
    capability_id: "CAP-003"
    title: "Isolated Agentic Intelligence"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Provide an isolated LangGraph service accessing data solely through the Controlled Tool Gateway."
    implementation_evidence: "ControlledToolGateway (10 approved tools) and 5-node LangGraph investigation graph execute via /api/v1/agents/runs and svc-intelligence-agent; standalone agent-worker cg.agent.anomaly.v1 Kafka loop is PLANNED."
    source_ref: "docs/specifications/data-requirements.md"
  - id: "FR-10"
    capability_id: "CAP-002"
    title: "Platform Control & Governance"
    scope: "data_platform"
    priority: "MANDATORY"
    status: "BASELINED"
    implementation_status: "PARTIALLY_IMPLEMENTED"
    statement: "Manage users, RBAC roles, monitored instruments, watermarks, observability telemetry, and audit logs across PostgreSQL and control-plane endpoints."
    implementation_evidence: "Defense-in-depth middleware, IAM token/verify/revoke/api-keys, catalog/config/observability endpoints, and Prometheus exporter execute; per-route RBAC Depends() guards across domain routers remain PARTIALLY_IMPLEMENTED (PROP-APP-004)."
    source_ref: "docs/specifications/data-requirements.md"

non_functional_requirements:
  - id: "NFR-001"
    category: "Performance"
    title: "Hot Latest Price Latency"
    target: "P50 <= 5ms, P95 <= 15ms, P99 <= 30ms"
    status: "BASELINED"
    verification_status: "UNVERIFIED_UNDER_PRODUCTION_LOAD"
    verification_note: "Target latency SLA; in-process simulation and API tests pass, while live multi-container benchmark against dedicated Redis/ClickHouse nodes has not been executed."
    source_ref: "docs/specifications/non-functional-requirements.md"
  - id: "NFR-002"
    category: "Performance"
    title: "Historical Candles Query Latency"
    target: "P50 <= 25ms, P95 <= 80ms, P99 <= 200ms"
    status: "BASELINED"
    verification_status: "UNVERIFIED_UNDER_PRODUCTION_LOAD"
    verification_note: "Target latency SLA; ClickHouse schema indexing and BoundedTimeRange guards exist, live ClickHouse cluster load benchmark is NOT_RUN."
    source_ref: "docs/specifications/non-functional-requirements.md"
  - id: "NFR-003"
    category: "Reliability"
    title: "Plane Isolation & Graceful Degradation"
    target: "100% Data Plane uptime when Intelligence Plane or Redis is unavailable"
    status: "BASELINED"
    verification_status: "PARTIALLY_VERIFIED_IN_PROCESS"
    verification_note: "Clean architecture imports (TC-006) and ClickHouse fallback on Redis miss (TC-003, TC-009, TC-010) pass in-process."
    source_ref: "docs/specifications/non-functional-requirements.md"
