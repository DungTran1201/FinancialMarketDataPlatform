version: "1.0"
metadata:
  register_id: "REG-CANONICAL-SOURCES-001"
  title: "Canonical Technical Source of Truth Register"
  updated_at: "2026-11-15"
  governing_rule: ".agents/rules/source-of-truth.md"

domains:
  requirements:
    canonical_model: "models/requirements/requirements.yaml"
    canonical_spec: "docs/specifications/data-requirements.md"
    consumer_portal: "docs/contracts/requirements-matrix.md"
    authority_hierarchy: ["models/requirements/requirements.yaml", "docs/specifications/data-requirements.md"]

  business_rules:
    canonical_model: "models/requirements/business-rules.yaml"
    canonical_spec: "docs/specifications/data-requirements.md"
    consumer_portal: "docs/contracts/requirements-matrix.md"
    authority_hierarchy: ["models/requirements/business-rules.yaml", "src/shared/domain/quant.py"]

  acceptance_criteria:
    canonical_model: "models/requirements/acceptance-criteria.yaml"
    canonical_spec: "docs/specifications/non-functional-requirements.md"
    consumer_portal: "docs/contracts/requirements-matrix.md"
    authority_hierarchy: ["models/requirements/acceptance-criteria.yaml"]

  components_and_containers:
    canonical_model: "models/architecture/components.yaml"
    canonical_spec: "docs/architecture/02-system-container-architecture.md"
    deployment_spec: "docker-compose.yml"
    consumer_portal: "docs/operations/deployment-guide.md"
    authority_hierarchy: ["models/architecture/components.yaml", "docker-compose.yml", "src/"]

  kafka_streaming_topics:
