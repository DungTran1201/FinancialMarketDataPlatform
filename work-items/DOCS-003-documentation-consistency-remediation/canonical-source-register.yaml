    canonical_code: "src/shared/contracts/events/market_events.py"
    consumer_portal: "docs/contracts/api-contracts.md"
    authority_hierarchy: ["src/shared/contracts/events/market_events.py", "models/data-platform/events.yaml"]

  lakehouse_orchestration_pipeline:
    canonical_code: "src/lakehouse/orchestration/pipeline.py"
    canonical_spec: "docs/architecture/14-data-platform-v01-and-microservices-architecture.md"
    diagram_ref: "docs/diagrams/data-platform/08-end-to-end-data-platform-v01-pipeline.md"
    authority_hierarchy: ["src/lakehouse/orchestration/pipeline.py", "docs/architecture/14-data-platform-v01-and-microservices-architecture.md"]

  api_and_serving_endpoints:
    canonical_model: "models/api/api.yaml"
    canonical_spec: "docs/specifications/api-specification.md"
    canonical_code: "src/serving/api/main.py"
    consumer_portal: "docs/contracts/api-contracts.md"
    authority_hierarchy: ["models/api/api.yaml", "src/serving/api/main.py"]

  deployment_topology:
    canonical_compose: "docker-compose.yml"
    consumer_portal: "docs/operations/deployment-guide.md"
    authority_hierarchy: ["docker-compose.yml", "deploy/"]
