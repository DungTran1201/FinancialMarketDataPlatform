name: Documentation V2 Validation

# Automatic documentation validation runs in .github/workflows/ci.yml
# (documentation-validation job) on all pushes and pull requests to avoid
# duplicate workflow runs. Keep this workflow for explicit manual dispatches.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs-v2:
    name: Manual Documentation V2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Documentation Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"

      - name: Validate Documentation V2 Governance, Schemas, Links & Traceability
        run: python scripts/docs/validate_docs.py

      - name: Run Documentation Validator Unit Tests
        run: python -m pytest tests/docs/ -v
