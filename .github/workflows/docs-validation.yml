name: Documentation V2 Validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/docs/**"
      - "tests/docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".agents/**"
      - ".github/workflows/docs-validation.yml"
  push:
    branches:
      - main
      - "docs-v2/**"
    paths:
      - "docs/**"
      - "scripts/docs/**"
      - "tests/docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".agents/**"
      - ".github/workflows/docs-validation.yml"

jobs:
  validate-docs-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Documentation Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,dev]"

      - name: Validate Documentation V2 Governance, Schemas, Links & Traceability
        run: python scripts/docs/validate_docs.py

      - name: Run Documentation Validator Unit Tests
        run: pytest tests/docs/ -v
