name: CI

on:
  push:
    branches:
      - main
      - develop
      - "docs-v2/**"
      - "docs/**"
      - "arch/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-tests:
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite:
          - unit
          - architecture
          - contract
          - data_quality
          - integration
          - e2e
          - resilience
          - performance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ${{ matrix.suite }} tests
        run: python -m pytest "tests/${{ matrix.suite }}/" -v

  documentation-validation:
    name: Documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"

      - name: Validate Documentation V2
        run: python scripts/docs/validate_docs.py

      - name: Test documentation validator
        run: python -m pytest tests/docs/ -v

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest