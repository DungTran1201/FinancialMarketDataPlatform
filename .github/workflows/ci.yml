name: CI

on:
  push:
    branches:
      - main
      - develop
      - "docs-v2/**"
      - "docs/**"
      - "arch/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python-tests:
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite:
          - unit
          - architecture
          - contract
          - data_quality
          - integration
          - e2e
          - resilience
          - performance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ${{ matrix.suite }} tests
        run: python -m pytest "tests/${{ matrix.suite }}/" -v

  documentation-validation:
    name: Documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"

      - name: Validate Documentation V2
        run: python scripts/docs/validate_docs.py

      - name: Test documentation validator
        run: python -m pytest tests/docs/ -v

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check src tests scripts tools

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  package-build:
    name: Python wheel build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python wheel
        run: python -m build --wheel

  ci-status:
    name: CI status gate
    needs:
      - python-tests
      - documentation-validation
      - lint
      - frontend
      - package-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all CI jobs succeeded
        shell: bash
        run: |
          echo "python-tests: ${{ needs.python-tests.result }}"
          echo "documentation-validation: ${{ needs.documentation-validation.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "package-build: ${{ needs.package-build.result }}"
          if [[ "${{ needs.python-tests.result }}" != "success" \
             || "${{ needs.documentation-validation.result }}" != "success" \
             || "${{ needs.lint.result }}" != "success" \
             || "${{ needs.frontend.result }}" != "success" \
             || "${{ needs.package-build.result }}" != "success" ]]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
