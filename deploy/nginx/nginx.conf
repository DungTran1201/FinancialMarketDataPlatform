# =============================================================================
# Real-time Financial Market Data Platform — HTTPS Edge Gateway & WAF (Nginx)
# Trust Zone 2 (frontend_net): Enforces TLS 1.3, Subdomain Routing, Edge Rate
# Limiting, WebSocket/SSE Proxying, and Internal IP/Port Concealment.
# =============================================================================

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Hide Nginx version and internal upstream metadata
    server_tokens off;

    # Edge Rate Limiting & Connection Limiting Zones (keyed by binary client IP)
    limit_req_zone  $binary_remote_addr zone=edge_api_limit:10m  rate=120r/m;
    limit_req_zone  $binary_remote_addr zone=edge_auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=edge_conn_limit:10m;

    # TLS 1.2 / TLS 1.3 Hardened Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Internal Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # 1. HTTP (80) -> Permanent Redirect to HTTPS (443)
    # -------------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name fmdp.local *.fmdp.local localhost;
        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # 2. Primary API & WebSocket HTTPS Gateway (https://api.fmdp.local)
    #    Routes to internal container: backend-api:8000 (Never exposed directly)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name fmdp.local api.fmdp.local localhost;

        ssl_certificate     /etc/nginx/certs/fmdp.crt;
        ssl_certificate_key /etc/nginx/certs/fmdp.key;

        client_max_body_size 1m;
        limit_conn edge_conn_limit 30;

        # Security Headers at Edge
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Conceal internal upstream headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Auth Endpoints (Strict 10 req/min rate limit + burst 5)
        location /api/v1/auth/ {
            limit_req zone=edge_auth_limit burst=5 nodelay;
            set $backend_upstream http://backend-api:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket Multiplexer Stream (wss://api.fmdp.local/ws/v1/market/stream)
        location /ws/v1/ {
            limit_req zone=edge_api_limit burst=20 nodelay;
            set $backend_upstream http://backend-api:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        # REST & SSE API Endpoints (/api/v1/*)
        location / {
            limit_req zone=edge_api_limit burst=30 nodelay;
            set $backend_upstream http://backend-api:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # -------------------------------------------------------------------------
    # 3. Observability HTTPS Subdomain (https://monitor.fmdp.local -> grafana:3000)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name monitor.fmdp.local;

        ssl_certificate     /etc/nginx/certs/fmdp.crt;
        ssl_certificate_key /etc/nginx/certs/fmdp.key;

        location / {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # -------------------------------------------------------------------------
    # 4. BI Analytics HTTPS Subdomain (https://bi.fmdp.local -> superset:8088)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name bi.fmdp.local;

        ssl_certificate     /etc/nginx/certs/fmdp.crt;
        ssl_certificate_key /etc/nginx/certs/fmdp.key;

        location / {
            set $superset_upstream http://superset:8088;
            proxy_pass $superset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # -------------------------------------------------------------------------
    # 5. MinIO S3 Console HTTPS Subdomain (https://console.s3.fmdp.local -> minio:9001)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name console.s3.fmdp.local;

        ssl_certificate     /etc/nginx/certs/fmdp.crt;
        ssl_certificate_key /etc/nginx/certs/fmdp.key;

        location / {
            set $minio_console_upstream http://minio:9001;
            proxy_pass $minio_console_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

